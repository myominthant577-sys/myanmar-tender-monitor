name: Scan official newspaper PDFs
on:
  workflow_dispatch:
  schedule:
    - cron: '45 1 * * *' # 08:15 Myanmar time (UTC+06:30)
permissions:
  contents: write
concurrency:
  group: tender-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r collector/requirements.txt
      - run: python collector/scan.py
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tenders.json
          if ! git diff --cached --quiet; then
            git commit -m "Update official newspaper scan results"
            git push
          fi
